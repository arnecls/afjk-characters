[mypy]
python_version = 3.12
pretty = true
show_error_codes = true
mypy_path = scripts
explicit_package_bases = true
follow_imports = skip
namespace_packages = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true

[mypy-hero_pipeline.analysis.effects]
ignore_errors = true

[mypy-hero_pipeline.analysis.behavior]
ignore_errors = true

[mypy-hero_pipeline.analysis.scoring_facts]
ignore_errors = true

[mypy-hero_pipeline.analysis.skill_meta]
ignore_errors = true

[mypy-hero_pipeline.analysis.magnitudes]
ignore_errors = true

[mypy-hero_pipeline.relationships.scoring]
ignore_errors = true

[mypy-hero_pipeline.analysis.serialize]
ignore_errors = true

[mypy-hero_schema.*]
ignore_missing_imports = true

[mypy-heroes_io.*]
ignore_missing_imports = true

[mypy-character_stat_ranks.*]
ignore_missing_imports = true

[mypy-render_overview.*]
ignore_missing_imports = true

[mypy-render_site.*]
ignore_missing_imports = true

[mypy-jsonschema.*]
ignore_missing_imports = true
