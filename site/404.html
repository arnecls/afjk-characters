<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="github-pages-base" content="/afjk-characters/">
  <title>AFK Journey Heroes</title>
  <script>
    (function () {
      var meta = document.querySelector('meta[name="github-pages-base"]');
      var base = (meta && meta.content) || "/";
      if (!base.endsWith("/")) {
        base += "/";
      }
      var path = location.pathname;
      var idx = path.indexOf("/hero/");
      var target = base;
      if (idx !== -1) {
        var slug = path.slice(idx + 6).replace(/\/$/, "");
        if (slug) {
          target = base + "#hero/" + encodeURIComponent(slug);
        }
      }
      location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
