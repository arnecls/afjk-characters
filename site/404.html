<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="github-pages-base" content="/afjk-characters/">
  <title>AFK Journey Heroes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="logo" data-nav-home>AFK Journey Heroes</a>
      <input type="search" id="search" class="search" placeholder="Search name, faction, class…" autocomplete="off">
      <div class="view-toggle" role="group" aria-label="View mode">
        <button type="button" class="view-btn active" data-view="grid" aria-pressed="true">Grid</button>
        <button type="button" class="view-btn" data-view="list" aria-pressed="false">List</button>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <nav class="header-back hidden" id="header-back" aria-label="Back navigation">
      <a href="#" data-nav-home>&larr; All heroes</a>
    </nav>
  </header>

  <main id="app">
    <section id="grid-view" class="grid-view">
      <div id="hero-grid" class="hero-grid"></div>
      <p id="empty-state" class="empty-state hidden">No heroes match your filters.</p>
    </section>

    <section id="list-view" class="list-view hidden">
      <div class="table-scroll">
        <table id="heroes-table" class="heroes-table">
          <thead id="heroes-table-head"></thead>
          <tbody id="heroes-table-body"></tbody>
        </table>
      </div>
      <p id="list-empty-state" class="empty-state hidden">No heroes match your filters.</p>
    </section>

    <section id="detail-view" class="detail-view hidden">
      <article id="hero-detail" class="hero-detail"></article>
    </section>
  </main>

  <footer class="site-footer">
    <p>Hero data derived from skill analysis. Not affiliated with Lilith Games or Yaphalla.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
